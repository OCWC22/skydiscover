# GPU Mode: MXFP4 Mixture-of-Experts (MoE) Kernel — AMD Instinct MI355X (cDNA4)

max_iterations: 100
checkpoint_interval: 1
log_level: "INFO"

llm:
  models:
    - name: "gpt-5"
      weight: 1.0
  api_base: https://api.openai.com/v1
